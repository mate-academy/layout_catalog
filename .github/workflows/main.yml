name: GPT Review

permissions:
  contents: read
  pull-requests: write
  issues: read

on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: anc95/ChatGPT-CodeReview@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Opcional
          LANGUAGE: English
          MODEL: GPT-4
          top_p: 1
          temperature: 1