<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Catalog</title>
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="styles/index.scss"
    />
  </head>

  <body class="page">
    <header class="header">
      <nav class="nav">
        <ul class="nav__list">
          <li class="nav__item">
            <a
              href="#"
              class="nav__link is-active"
            >
              Apple
            </a>
          </li>

          <li class="nav__item">
            <a
              href="#"
              class="nav__link"
            >
              Smartphones
            </a>
          </li>

          <li class="nav__item">
            <a
              href="#"
              class="nav__link"
            >
              Gadgets
            </a>
          </li>

          <li class="nav__item">
            <a
              href="#"
              class="nav__link"
              data-qa="nav-hover"
            >
              Laptops & computers
            </a>
          </li>

          <li class="nav__item">
            <a
              href="#"
              class="nav__link"
            >
              Tablets
            </a>
          </li>
        </ul>
      </nav>
    </header>

    <main class="catalog">
      <article
        class="card"
        data-qa="card"
      >
        <div class="card__image-container">
          <img
            src="https://via.placeholder.com/200x200"
            alt="iPhone 15 Pro"
            class="card__image"
          />
        </div>

        <div class="card__content">
          <h2 class="card__title">iPhone 15 Pro</h2>

          <div class="stars card__stars">
            <span class="stars__item stars__item--filled">★</span>
            <span class="stars__item stars__item--filled">★</span>
            <span class="stars__item stars__item--filled">★</span>
            <span class="stars__item stars__item--filled">★</span>
            <span class="stars__item">★</span>
          </div>

          <div class="card__footer">
            <span class="card__price">$999</span>
            <a
              href="#"
              class="card__button"
              data-qa="card-hover"
            >
              Buy
            </a>
          </div>
        </div>
      </article>
    </main>
  </body>
</html>
