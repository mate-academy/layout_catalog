<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Catalog</title>
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="styles/index.scss"
    />
  </head>

  <body>
    <header class="header">
      <a
        class="header__logo"
        href="#"
      >
        <img
          src="./images/logo.png"
          alt="Moyo"
        />
      </a>
      <ul class="header__list">
        <li class="header__item">
          <a
            class="header__link is-active"
            href="#"
          >
            Apple
          </a>
        </li>
        <li class="header__item">
          <a
            class="header__link"
            href="#"
          >
            Samsung
          </a>
        </li>
        <li class="header__item">
          <a
            class="header__link"
            href="#"
          >
            Smartphones
          </a>
        </li>
        <li class="header__item">
          <a
            class="header__link"
            data-qa="nav-hover"
            href="#"
          >
            Laptops & computers
          </a>
        </li>
        <li class="header__item">
          <a
            class="header__link"
            href="#"
          >
            Gadgets
          </a>
        </li>
        <li class="header__item">
          <a
            class="header__link"
            href="#"
          >
            Tablets
          </a>
        </li>
        <li class="header__item">
          <a
            class="header__link"
            href="#"
          >
            Photo
          </a>
        </li>
        <li class="header__item">
          <a
            class="header__link"
            href="#"
          >
            Video
          </a>
        </li>
      </ul>
    </header>
    <main class="catalog">
      <div
        class="card"
        data-qa="card"
      >
        <img
          class="card__img"
          src="./images/imac.jpeg"
          alt="Apple iMac 27"
        />
        <div class="card__info">
          <div class="card__title">
            APPLE A1419 iMac 27" Retina 5K Monoblock (MNED2UA/A)
          </div>
          <div class="card__code">Product code: 195434</div>
          <div class="card__reviews">
            <div class="stars stars--4">
              <span class="stars__item"></span>
              <span class="stars__item"></span>
              <span class="stars__item"></span>
              <span class="stars__item"></span>
              <span class="stars__item"></span>
            </div>
            <div>Reviews: 5</div>
          </div>
          <div class="card__price">
            <div>Price:</div>
            <div>$2,199</div>
          </div>
          <a
            class="card__buy"
            data-qa="card-hover"
            href="#"
          >
            BUY
          </a>
        </div>
      </div>
    </main>
    <script>
      const container = document.querySelector('.catalog');
      const template = document.querySelector('.card');
      const count = 8;

      for (let i = 0; i < count - 1; i++) {
        const clone = template.cloneNode(true);
        clone.removeAttribute('data-qa');
        const buyButton = clone.querySelector('.card__buy');
        if (buyButton) {
          buyButton.removeAttribute('data-qa');
        }
        container.appendChild(clone);
      }
    </script>
  </body>
</html>
