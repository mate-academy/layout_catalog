<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Catalog</title>
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="styles/index.scss"
    />
  </head>

  <body>
    <header class="header">
      <a
        href="#"
        class="header__logo"
      >
        <img
          src="images/logo.png"
          alt="Moyo logo"
        />
      </a>

      <nav>
        <ul class="header__nav-list">
          <li class="header__nav-item">
            <a
              class="header__nav-link is-active"
              href="#"
            >
              Apple
            </a>
          </li>
          <li class="header__nav-item">
            <a
              class="header__nav-link"
              href="#"
            >
              Samsung
            </a>
          </li>
          <li class="header__nav-item">
            <a
              class="header__nav-link"
              href="#"
            >
              Smartphones
            </a>
          </li>
          <li class="header__nav-item">
            <a
              class="header__nav-link"
              href="#"
              data-qa="nav-hover"
            >
              Laptops & Computers
            </a>
          </li>
          <li class="header__nav-item">
            <a
              class="header__nav-link"
              href="#"
            >
              Gadgets
            </a>
          </li>
          <li class="header__nav-item">
            <a
              class="header__nav-link"
              href="#"
            >
              tablets
            </a>
          </li>
          <li class="header__nav-item">
            <a
              class="header__nav-link"
              href="#"
            >
              photo
            </a>
          </li>
          <li class="header__nav-item">
            <a
              class="header__nav-link"
              href="#"
            >
              video
            </a>
          </li>
        </ul>
      </nav>
    </header>
    <main class="catalog">
      <div
        class="card"
        data-qa="card"
      >
        <div class="card__image"></div>
        <div class="card__info">
          <h3 class="card__name">
            APPLE A1419 iMac 27" Retina 5K Monoblock (MNED2UA/A)
          </h3>
          <p class="card__product-code">Product code: 195434</p>
        </div>
        <div class="stars stars--4">
          <div class="stars__star"></div>
          <div class="stars__star"></div>
          <div class="stars__star"></div>
          <div class="stars__star"></div>
          <div class="stars__star"></div>

          <span class="stars__reviews-count">Reviews: 5</span>
        </div>
        <div class="card__price-block">
          <span class="card__price-label">Price:</span>
          <span class="card__price">$2,199</span>
        </div>

        <button
          class="card__buy-button"
          data-qa="card-hover"
        >
          BUY
        </button>
      </div>
    </main>
  </body>
</html>
