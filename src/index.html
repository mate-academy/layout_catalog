<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Catalog</title>
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="styles/style.scss"
    />
  </head>
  <body>
    <header class="header">
      <div class="logo">
        <a
          href="./index.html"
          class="logo__link"
        >
          <img
            class="logo__img"
            src="./images/logo.png"
            alt="Moyo-logo"
          />
        </a>
      </div>
      <nav class="nav">
        <ul class="nav__list">
          <li class="nav__item">
            <a
              href="#"
              class="nav__link nav-hover"
              data-qa="nav-hover"
            >
              Apple
            </a>
          </li>
          <li class="nav__item">
            <a
              href="#"
              class="nav__link"
            >
              Samsung
            </a>
          </li>
          <li class="nav__item">
            <a
              href="#"
              class="nav__link"
            >
              Smartphones
            </a>
          </li>
          <li class="nav__item">
            <a
              href="#"
              class="nav__link nav__link--highligh "
              data-qa="nav-hover"
            >
              laptops & Computers
            </a>
          </li>
          <li class="nav__item">
            <a
              href="#"
              class="nav__link"
            >
              Gadgets
            </a>
          </li>
          <li class="nav__item">
            <a
              href="#"
              class="nav__link"
            >
              Tablets
            </a>
          </li>
          <li class="nav__item">
            <a
              href="#"
              class="nav__link"
            >
              Photo
            </a>
          </li>
          <li class="nav__item">
            <a
              href="#"
              class="nav__link"
            >
              Video
            </a>
          </li>
        </ul>
      </nav>
    </header>

    <main class="main">

      <div class="product__grid">
        <div
        class="product-card"
        data-qa="card"
           >
          <div class="product-card__main-photo">
            <img
            src="../src/images/imac.jpeg"
            alt="laptop-screen"
          />
          </div>
          <div class="product-card__information">
            <h1 class="product-card__title">
            APPLE A1419 iMac 27"
              <wbr />
            Retina 5K Monoblock (MNED2UA/A)
            </h1>
            <p class="product-card__code-description">Product code: 195434</p>
          </div>
          <div class="product-card__rating">
            <div class="stars stars--4">
              <span class="stars__star"></span>
              <span class="stars__star"></span>
              <span class="stars__star"></span>
              <span class="stars__star"></span>
              <span class="stars__star"></span>
            </div>
            <p class="product-card__reviews">Reviews: 5</p>
          </div>
          <div class="product-card__price-container">
            <span class="product-card__price-label">Price:</span>
            <span class="product-card__price">$2,199</span>
          </div>
          <div class="product-card__button-wrapper">
            <a
            href="#"
            class="product-card__btn"
            data-qa="card-hover"
          >
            BUY
            </a>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
