<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Moyo Catalog</title>
    <link rel="stylesheet" href="./styles/index.scss" />
  </head>
  <body class="page">
    <header class="header">
      <a class="header__logo" href="#">
        <img src="images/logo.png" alt="logo" />
      </a>

      <nav class="nav">
        <ul class="nav__list">
          <li><a href="#" class="nav__link is-active">Apple</a></li>
          <li><a href="#" class="nav__link">Samsung</a></li>
          <li><a href="#" class="nav__link">Smartphones</a></li>
          <li>
            <a href="#" class="nav__link" data-qa="nav-hover">
              Laptops & computers
            </a>
          </li>
        </ul>
      </nav>
    </header>

    <main>
      <div class="catalog">
        <article class="card" data-qa="card">
          <img class="card__image" src="images/imac.png" alt="iMac" />
          <h3 class="card__title">APPLE A1419 iMac 27" Retina</h3>
          <div class="stars">★★★★☆</div>
          <a href="#" class="card__button" data-qa="card-hover">BUY</a>
        </article>
      </div>
    </main>
  </body>
</html>
