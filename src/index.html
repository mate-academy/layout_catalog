<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Catalog</title>
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="styles/index.scss"
    />
  </head>
  <body>
    <header class="header">
      <img
        src="./images/logo.png"
        alt="Logo"
        class="header__logo"
      />
      <span class="header__title">My Catalog</span>
      <nav
        class="nav"
        aria-label="Main navigation"
      >
        <a
          href="#"
          class="nav__link is-active"
        >
          Apple
        </a>
        <a
          href="#"
          class="nav__link"
        >
          Smartphones
        </a>
        <a
          href="#"
          class="nav__link"
        >
          Audio
        </a>
        <a
          href="#"
          class="nav__link"
          data-qa="nav-hover"
        >
          Laptops & computers
        </a>
        <a
          href="#"
          class="nav__link"
        >
          Accessories
        </a>
      </nav>
    </header>
    <main class="catalog">
      <article
        class="card"
        data-qa="card"
      >
        <img
          src="./images/imac.jpeg"
          alt="iMac"
          class="card__image"
        />
        <h2 class="card__title">iMac 24"</h2>
        <div class="stars card__stars">
          <img
            src="./images/star-active.svg"
            class="stars__star"
            alt="star"
          />
          <img
            src="./images/star-active.svg"
            class="stars__star"
            alt="star"
          />
          <img
            src="./images/star-active.svg"
            class="stars__star"
            alt="star"
          />
          <img
            src="./images/star-active.svg"
            class="stars__star"
            alt="star"
          />
          <img
            src="./images/star.svg"
            class="stars__star"
            alt="star"
          />
        </div>
        <div class="card__desc">Apple M1 chip, 8-core GPU</div>
        <div class="card__actions">
          <a
            href="#"
            class="card__button"
            data-qa="card-hover"
          >
            Buy
          </a>
          <a
            href="#"
            class="card__button"
          >
            More Info
          </a>
        </div>
      </article>
      <article class="card">
        <img
          src="./images/imac.jpeg"
          alt="MacBook Air"
          class="card__image"
        />
        <h2 class="card__title">MacBook Air</h2>
        <div class="stars card__stars">
          <img
            src="./images/star-active.svg"
            class="stars__star"
            alt="star"
          />
          <img
            src="./images/star-active.svg"
            class="stars__star"
            alt="star"
          />
          <img
            src="./images/star-active.svg"
            class="stars__star"
            alt="star"
          />
          <img
            src="./images/star.svg"
            class="stars__star"
            alt="star"
          />
          <img
            src="./images/star.svg"
            class="stars__star"
            alt="star"
          />
        </div>
        <div class="card__desc">Apple M2 chip, 8GB RAM</div>
        <div class="card__actions">
          <a
            href="#"
            class="card__button"
          >
            Buy
          </a>
          <a
            href="#"
            class="card__button"
          >
            More Info
          </a>
        </div>
      </article>
      <article class="card">
        <img
          src="./images/imac.jpeg"
          alt="Mac Mini"
          class="card__image"
        />
        <h2 class="card__title">Mac Mini</h2>
        <div class="stars card__stars">
          <img
            src="./images/star-active.svg"
            class="stars__star"
            alt="star"
          />
          <img
            src="./images/star-active.svg"
            class="stars__star"
            alt="star"
          />
          <img
            src="./images/star-active.svg"
            class="stars__star"
            alt="star"
          />
          <img
            src="./images/star-active.svg"
            class="stars__star"
            alt="star"
          />
          <img
            src="./images/star.svg"
            class="stars__star"
            alt="star"
          />
        </div>
        <div class="card__desc">Apple M2 Pro, SSD 512GB</div>
        <div class="card__actions">
          <a
            href="#"
            class="card__button"
          >
            Buy
          </a>
          <a
            href="#"
            class="card__button"
          >
            More Info
          </a>
        </div>
      </article>
    </main>
  </body>
</html>
