<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Catalog</title>
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="styles/index.scss"
    />
  </head>

  <body>
    <!--#region header-->
    <header class="header">
      <a
        href="https://mate.academy/study"
        class="logo"
      >
        <img
          src="./images/logo.png"
          alt="#"
        />
      </a>
      <nav class="header__nav nav">
        <ul class="nav__list">
          <li class="nav__item">
            <a
              href="#"
              class="nav__link is-active"
            >
              APPLE
            </a>
          </li>
          <li class="nav__item">
            <a
              href="#"
              class="nav__link"
            >
              SAMSUNG
            </a>
          </li>
          <li class="nav__item">
            <a
              href="#"
              class="nav__link"
            >
              SMARTPHONES
            </a>
          </li>
          <li class="nav__item">
            <a
              href="#"
              class="nav__link"
              data-qa="nav-hover"
            >
              LAPTOPS & COMPUTERS
            </a>
          </li>
          <li class="nav__item">
            <a
              href="#"
              class="nav__link"
            >
              GADGETS
            </a>
          </li>
          <li class="nav__item">
            <a
              href="#"
              class="nav__link"
            >
              TABLETS
            </a>
          </li>
          <li class="nav__item">
            <a
              href="#"
              class="nav__link"
            >
              PHOTO
            </a>
          </li>
          <li class="nav__item">
            <a
              href="#"
              class="nav__link"
            >
              VIDEO
            </a>
          </li>
        </ul>
      </nav>
    </header>
    <!--#endregion-->

    <!--#region catalog-->
    <main class="catalog">
      <div
        class="catalog__card card"
        data-qa="card-hover"
      >
        <img
          src="./images/imac.jpeg"
          alt="iMac"
          class="imac imac--image"
        />

        <div class="bottom card__bottom">
          <div class="bottom__info">
            APPLE A1419 iMac 27" Retina
            <br />
            5K Monoblock (MNED2UA/A)
          </div>
          <div class="bottom__code">Product code: 195434</div>

          <div class="reviews bottom__reviews">
            <div class="reviews__stars">
              <div class="star"></div>
              <div class="star"></div>
              <div class="star"></div>
              <div class="star"></div>
              <div class="star"></div>
            </div>
            <div class="reviews__value">Reviews: 5</div>
          </div>
          <div class="price bottom__price">
            <div class="price__item price__item--word">Price:</div>
            <div class="price__item price__item--value">$2,199</div>
          </div>
          <button
            class="bottom__buy"
            data-qa="hover"
          >
            BUY
          </button>
        </div>
      </div>
    </main>
    <!--#endregion-->
  </body>
</html>
