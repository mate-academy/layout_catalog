<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Catalog</title>
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="styles/index.scss"
    />
  </head>
  <body>
    <header class="header">
      <nav class="nav">
        <ul class="nav__list">
          <li>
            <a
              href="#"
              class="nav__link is-active"
            >
              Apple
            </a>
          </li>
          <li>
            <a
              href="#"
              class="nav__link"
            >
              Smartphones
            </a>
          </li>
          <li>
            <a
              href="#"
              class="nav__link"
            >
              TV & Video
            </a>
          </li>
          <li>
            <a
              href="#"
              class="nav__link"
              data-qa="nav-hover"
            >
              Laptops & computers
            </a>
          </li>
        </ul>
      </nav>
    </header>

    <main class="catalog">
      <section
        class="card"
        data-qa="card"
      >
        <img
          src="images/imac.jpeg"
          alt="iMac"
          class="card__image"
        />
        <h2 class="card__title">iMac</h2>
        <div class="stars">
          <img
            src="images/star.svg"
            class="stars__icon"
            alt="Star"
          />
        </div>
        <button
          class="card__button"
          data-qa="card-hover"
        >
          Buy
        </button>
      </section>
    </main>
  </body>
</html>
