<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Catalog</title>

    <link
      rel="stylesheet"
      href="./styles/index.scss"
    />
  </head>
  <body>
    <header class="header">
      <a
        href="/"
        class="logo"
      >
        <img
          src="./images/logo.png"
          alt="Logo"
        />
      </a>

      <nav class="nav">
        <ul class="nav__list">
          <li class="nav__item">
            <a
              href="#"
              class="nav__link is-active"
            >
              Apple
            </a>
          </li>

          <li class="nav__item">
            <a
              href="#"
              class="nav__link"
            >
              Samsung
            </a>
          </li>

          <li class="nav__item">
            <a
              href="#"
              class="nav__link"
            >
              Smartphones
            </a>
          </li>

          <li class="nav__item">
            <a
              href="#"
              class="nav__link"
              data-qa="nav-hover"
            >
              Laptops & computers
            </a>
          </li>
        </ul>
      </nav>
    </header>

    <main class="catalog">
      <div class="catalog__grid">
        <article
          class="card"
          data-qa="card"
        >
          <img
            src="./images/imac.jpeg"
            alt="iMac"
            class="card__image"
          />

          <h2 class="card__title">APPLE A1419 iMac 27" Retina 5K</h2>

          <div class="card__stars">
            <img
              src="./images/star-active.svg"
              alt="star"
            />
            <img
              src="./images/star-active.svg"
              alt="star"
            />
            <img
              src="./images/star-active.svg"
              alt="star"
            />
            <img
              src="./images/star-active.svg"
              alt="star"
            />
            <img
              src="./images/star.svg"
              alt="star"
            />
          </div>

          <a
            href="#"
            class="card__button"
            data-qa="card-hover"
          >
            Buy
          </a>
        </article>
      </div>
    </main>
  </body>
</html>
