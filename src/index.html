<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Catalog</title>
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="styles/index.scss"
    />
  </head>

  <body>
    <header class="header">
      <a href="#">
        <img
          class="logo"
          src="/src/images/logo.png"
          alt="Moyo logo"
        />
      </a>
      <nav class="nav">
        <ul class="nav_list">
          <li class="nav_item">
            <a
              class="nav_link"
              href="#is-active"
            >
              Apple
            </a>
          </li>
          <li class="nav_item">
            <a
              class="nav_link"
              href="#"
            >
              Samsung
            </a>
          </li>
          <li class="nav_item">
            <a
              class="nav_link"
              href="#"
            >
              Smartphones
            </a>
          </li>
          <li
            class="nav_item"
            data-qa="nav-hover"
          >
            <a
              class="nav_link"
              href="#"
            >
              Laptops & Computers
            </a>
          </li>
          <li class="nav_item">
            <a
              class="nav_link"
              href="#"
            >
              Gadgets
            </a>
          </li>
          <li class="nav_item">
            <a
              class="nav_link"
              href="#"
            >
              Tablets
            </a>
          </li>
          <li class="nav_item">
            <a
              class="nav_link"
              href="#"
            >
              Photo
            </a>
          </li>
          <li class="nav_item">
            <a
              class="nav_link"
              href="#"
            >
              Video
            </a>
          </li>
        </ul>
      </nav>
    </header>
    <main class="main">
      <div
        class="card"
        data-qa="card"
      >
        <h2 class="card_title">
          APPLE A1419 iMac 27" Retina 5K Monoblock (MNED2UA/A)
        </h2>

        <p class="card_code">Product code: 195434</p>

        <div class="card__container">
          <div class="stars stars--4">
            <div class="stars__star"></div>
            <div class="stars__star"></div>
            <div class="stars__star"></div>
            <div class="stars__star"></div>
            <div class="stars__star"></div>
            <span class="card_reviews">Reviews: 5</span>
          </div>
        </div>
        <div class="card_price">
          <p class="card_price-text">
            Price:
            <strong class="card_price-strong">$2,199</strong>
          </p>
        </div>

        <a
          href="#"
          class="card_buy-button"
          data-qa="card-hover"
        >
          BUY
        </a>
      </div>
    </main>
  </body>
</html>
