<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Catalog</title>
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="index.fadc686c.css"
    />
  </head>

  <body>
    <header class="main-header">
      <div class="logo-img">
        <a href="#">
          <img
            src="images/logo.png"
            alt="MOYO company logo in blue and black"
          />
        </a>
      </div>
      <nav>
        <ul class="nav-list">
          <li class="nav-item">
            <a
              href="#"
              class="nav-link is-active"
            >
              Apple
            </a>
          </li>
          <li class="nav-item">
            <a
              href="#"
              class="nav-link"
            >
              Samsung
            </a>
          </li>
          <li class="nav-item">
            <a
              href="#"
              class="nav-link"
            >
              Smartphones
            </a>
          </li>
          <li class="nav-item">
            <a
              href="#"
              class="nav-link"
              data-qa="nav-hover"
            >
              Laptops & Computers
            </a>
          </li>
          <li class="nav-item">
            <a
              href="#"
              class="nav-link"
            >
              Gadgets
            </a>
          </li>
          <li class="nav-item">
            <a
              href="#"
              class="nav-link"
            >
              Tablets
            </a>
          </li>
          <li class="nav-item">
            <a
              href="#"
              class="nav-link"
            >
              Photo
            </a>
          </li>
          <li class="nav-item">
            <a
              href="#"
              class="nav-link"
            >
              Video
            </a>
          </li>
        </ul>
      </nav>
    </header>
    <main class="catalog">
      <div
        class="card"
        data-qa="card"
      >
        <img
          class="card__image"
          src="images/imac.jpeg"
          alt="iMac"
        />
        <h2 class="card__title">
          APPLE A1419 iMac 27" Retina
          <br />
          5K Monoblock (MNED2UA/A)
        </h2>
        <p class="card__code">Product code: 195434</p>
        <div class="card__stars stars">
          <span class="stars__item stars__item--filled"></span>
          <span class="stars__item stars__item--filled"></span>
          <span class="stars__item stars__item--filled"></span>
          <span class="stars__item stars__item--filled"></span>
          <span class="stars__item"></span>
          <span class="stars__reviews">Reviews: 5</span>
        </div>
        <div class="card__price-block">
          <span class="card__price-label">Price:</span>
          <span class="card__price">$2,199</span>
        </div>
        <button
          class="card__buy"
          data-qa="card-hover"
        >
          BUY
        </button>
      </div>
    </main>
  </body>
</html>
