<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>Catalog</title>

    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="./styles/index.scss"
    />
  </head>

  <body>
    <header class="header">
      <a
        href="#"
        class="header__logo"
      >
        <img
          src="./images/logo.png"
          alt="Logo"
          class="header__logo-image"
        />
      </a>

      <nav class="nav">
        <a
          href="#"
          class="nav__link is-active"
        >
          Apple
        </a>

        <a
          href="#"
          class="nav__link"
        >
          Samsung
        </a>

        <a
          href="#"
          class="nav__link"
        >
          Smartphones
        </a>

        <a
          href="#"
          class="nav__link"
          data-qa="nav-hover"
        >
          Laptops & computers
        </a>

        <a
          href="#"
          class="nav__link"
        >
          Gadgets
        </a>

        <a
          href="#"
          class="nav__link"
        >
          Tablets
        </a>

        <a
          href="#"
          class="nav__link"
        >
          Photo
        </a>

        <a
          href="#"
          class="nav__link"
        >
          Video
        </a>
      </nav>
    </header>

    <main class="catalog">
      <article
        class="card"
        data-qa="card"
      >
        <img
          src="./images/imac.jpeg"
          alt="Apple"
          class="card__image"
        />

        <h2 class="card__title">APPLE A1419 iMac 27"</h2>

        <p class="card__code">Product code: 195434</p>

        <div class="card__rating">
          <div class="stars stars--4">
            <div class="stars__star"></div>
            <div class="stars__star"></div>
            <div class="stars__star"></div>
            <div class="stars__star"></div>
            <div class="stars__star"></div>
          </div>

          <span class="card__reviews">Reviews: 5</span>
        </div>

        <div class="card__price">
          <span>Price:</span>

          <span class="card__price-value">$2,199</span>
        </div>

        <a
          href="#"
          class="card__button"
          data-qa="card-hover"
        >
          Buy
        </a>
      </article>
    </main>
  </body>
</html>
