<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Catalog</title>
    <link rel="stylesheet" href="./src/styles/index.scss" />
  </head>
  <body>
    <header class="header">
      <div class="header__container">
        <img src="./src/images/logo.svg" alt="Logo" class="header__logo" />
        <nav class="nav">
          <a href="#" class="nav__link is-active">Apple</a>
          <a href="#" class="nav__link">TVs</a>
          <a href="#" class="nav__link">Smartphones</a>
          <a href="#" class="nav__link" data-qa="nav-hover">Laptops & computers</a>
        </nav>
      </div>
    </header>

    <main class="catalog">
      <div class="catalog__grid">
        <div class="card" data-qa="card">
          <div class="card__image" style="background-image: url('../images/product-1.jpg')"></div>
          <h2 class="card__title">MacBook Air</h2>
          <div class="card__price">$999</div>
          <div class="card__rating stars stars--4"></div>
          <a href="#" class="card__buy" data-qa="card-hover">Buy</a>
        </div>

        <!-- Repeat more cards without data-qa -->
      </div>
    </main>
  </body>
</html>
