<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Catalog</title>
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="styles/main.scss"
    />
  </head>

  <body>
    <header class="header">
      <div class="header__inner">
        <nav class="header__nav nav">
          <ul class="nav__list">
            <li class="nav__item">
              <a
                href="#"
                class="nav__link is-active"
              >
                Apple
              </a>
            </li>
            <li class="nav__item">
              <a
                href="#"
                class="nav__link"
              >
                Smartphones
              </a>
            </li>
            <li class="nav__item">
              <a
                href="#"
                class="nav__link"
              >
                Tablets
              </a>
            </li>
            <li class="nav__item">
              <a
                href="#"
                class="nav__link"
                data-qa="nav-hover"
              >
                Laptops & Computers
              </a>
            </li>
          </ul>
        </nav>
      </div>
    </header>

    <main class="catalog">
      <article
        class="card"
        data-qa="card"
      >
        <img
          src="./images/imac.jpeg"
          alt="iMac"
          class="card__image"
        />
        <h2 class="card__title">Apple iMac 24</h2>
        <div class="stars card__stars">
          <img
            src="./images/star.svg"
            alt="star"
            class="stars__icon"
          />
          <img
            src="./images/star.svg"
            alt="star"
            class="stars__icon"
          />
          <img
            src="./images/star.svg"
            alt="star"
            class="stars__icon"
          />
          <img
            src="./images/star.svg"
            alt="star"
            class="stars__icon"
          />
          <img
            src="./images/star.svg"
            alt="star"
            class="stars__icon"
          />
        </div>
        <a
          href="#"
          class="card__buy"
          data-qa="card-hover"
        >
          Buy
        </a>
      </article>
    </main>
  </body>
</html>
