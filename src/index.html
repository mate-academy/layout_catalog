<!-- #region head -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Catalog</title>
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="styles/index.scss"
    />
  </head>
  <!-- #endregion -->

  <body>
    <header class="header">
      <a
        href="#"
        class="header__logo"
      >
        <img
          src="images/logo.png"
          alt="MoYo"
        />
      </a>

      <nav class="nav">
        <ul class="nav__list">
          <li>
            <a
              href="#"
              class="nav__link is-active"
            >
              Apple
            </a>
          </li>
          <li>
            <a
              href="#"
              class="nav__link"
            >
              Samsung
            </a>
          </li>
          <li>
            <a
              href="#"
              class="nav__link"
            >
              Smartphones
            </a>
          </li>
          <li>
            <a
              href="#"
              class="nav__link"
              data-qa="nav-hover"
            >
              Laptops & Computers
            </a>
          </li>
          <li>
            <a
              href="#"
              class="nav__link"
            >
              Gadgets
            </a>
          </li>
          <li>
            <a
              href="#"
              class="nav__link"
            >
              Tablets
            </a>
          </li>
          <li>
            <a
              href="#"
              class="nav__link"
            >
              Photo
            </a>
          </li>
          <li>
            <a
              href="#"
              class="nav__link"
            >
              Video
            </a>
          </li>
        </ul>
      </nav>
    </header>

    <main>
      <div
        class="catalog"
        id="catalog"
      >
        <div
          class="card"
          data-qa="card"
        >
          <img
            src="images/imac.jpeg"
            alt="photo"
            class="card__image"
          />

          <div class="card__title">
            <div class="title">
              APPLE A1419 iMac 27" Retina 5K Monoblock (MNED2UA/A)
            </div>
            <div class="title title--product-code">Product code: 195434</div>
          </div>

          <div class="card__review">
            <div class="stars stars--active">
              <div class="stars__star"></div>
              <div class="stars__star"></div>
              <div class="stars__star"></div>
              <div class="stars__star"></div>
              <div class="stars__star"></div>
            </div>
            <div>Reviews: 5</div>
          </div>
          <div class="card__price">
            <div class="price price--title">Price:</div>
            <div class="price price--sum">$2,199</div>
          </div>
          <a
            class="card__button"
            href="#"
            data-qa="card-hover"
          >
            Buy
          </a>
        </div>
      </div>
    </main>

    <script>
      document.addEventListener('DOMContentLoaded', function () {
        const container = document.getElementById('catalog');
        const templateCard = container.querySelector('.card');
        if (container && templateCard) {
          const cardsToAdd = 7;
          for (let i = 1; i <= cardsToAdd; i++) {
            const newCard = templateCard.cloneNode(true);
            container.appendChild(newCard);
            newCard.removeAttribute('data-qa');
          }
          container.querySelector('.card').setAttribute('data-qa', 'card');
        }
      });
    </script>
  </body>
</html>
