<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Catalog</title>
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="styles/index.scss"
    />
  </head>

  <body>
    <header class="header">
      <a
        href="/"
        class="header__logo"
      >
        <img
          src="./images/logo.png"
          alt="Website Logo"
        />
      </a>

      <nav class="header__nav-menu nav-menu">
        <ul class="nav-menu__list">
          <li class="nav-menu__item">
            <a
              href="#apple"
              class="nav-menu__link is-active"
            >
              Apple
            </a>
          </li>

          <li class="nav-menu__item">
            <a
              href="#samsung"
              class="nav-menu__link"
            >
              Samsung
            </a>
          </li>

          <li class="nav-menu__item">
            <a
              href="#smartphones"
              class="nav-menu__link"
            >
              Smartphones
            </a>
          </li>

          <li class="nav-menu__item">
            <a
              href="#laptops"
              class="nav-menu__link"
              data-qa="nav-hover"
            >
              Laptops & Computers
            </a>
          </li>

          <li class="nav-menu__item">
            <a
              href="#gadgets"
              class="nav-menu__link"
            >
              Gadgets
            </a>
          </li>

          <li class="nav-menu__item">
            <a
              href="#tablets"
              class="nav-menu__link"
            >
              Tablets
            </a>
          </li>

          <li class="nav-menu__item">
            <a
              href="#photo"
              class="nav-menu__link"
            >
              Photo
            </a>
          </li>

          <li class="nav-menu__item">
            <a
              href="#video"
              class="nav-menu__link"
            >
              Video
            </a>
          </li>
        </ul>
      </nav>
    </header>
    <main
      class="catalog"
      id="cards-container"
    >
      <!-- Шаблонна картка товару -->
      <article
        class="product-card"
        data-qa="card"
      >
        <img
          class="product-card__icon"
          alt="APPLE A1419 iMac 27 Retina 5K Monoblock (MNED2UA/A)"
          src="images/imac.jpeg"
        />
        <div class="product-card__details">
          <h3 class="product-card__details-title">
            APPLE A1419 iMac 27" Retina 5K Monoblock (MNED2UA/A)
          </h3>
          <p class="product-card__details-code">Product code: 195434</p>
        </div>
        <div class="product-card__reviews">
          <div
            class="product-card__reviews-stars product-card__reviews-stars--4"
          >
            <span class="product-card__reviews-stars-star"></span>
            <span class="product-card__reviews-stars-star"></span>
            <span class="product-card__reviews-stars-star"></span>
            <span class="product-card__reviews-stars-star"></span>
            <span class="product-card__reviews-stars-star"></span>
          </div>
          <p class="product-card__reviews-text">
            Reviews:
            <span>5</span>
          </p>
        </div>
        <div class="product-card__price">
          <span class="product-card__price-label">Price:</span>
          <span class="product-card__price-value">$2,199</span>
        </div>
        <a
          href="#"
          class="product-card__buy-button"
          data-qa="card-hover"
        >
          Buy
        </a>
      </article>
    </main>
    <script src="../src/scripts/main.js"></script>
  </body>
</html>
