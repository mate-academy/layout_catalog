<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Catalog</title>
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="styles/index.scss"
    />
  </head>

  <body>
    <header class="header">
      <a href="/">
        <img
          class="logo"
          src="./images/logo.png"
          alt="Moyo company logo"
        />
      </a>

      <nav class="nav">
        <ul class="nav__list">
          <li class="nav__item">
            <a
              href="#"
              class="nav__link is-active"
            >
              Apple
            </a>
          </li>
          <li class="nav__item">
            <a
              href="#"
              class="nav__link"
            >
              Samsung
            </a>
          </li>
          <li class="nav__item">
            <a
              href="#"
              class="nav__link"
            >
              Smartphones
            </a>
          </li>
          <li
            class="nav__item"
            data-qa="nav-hover"
          >
            <a
              href="#"
              class="nav__link"
            >
              Laptops & Computers
            </a>
          </li>
          <li class="nav__item">
            <a
              href="#"
              class="nav__link"
            >
              Gadgets
            </a>
          </li>
          <li class="nav__item">
            <a
              href="#"
              class="nav__link"
            >
              Tablets
            </a>
          </li>
          <li class="nav__item">
            <a
              href="#"
              class="nav__link"
            >
              Photo
            </a>
          </li>
          <li class="nav__item">
            <a
              href="#"
              class="nav__link"
            >
              Video
            </a>
          </li>
        </ul>
      </nav>
    </header>
    <main class="cards-container">
      <div
        class="card"
        data-qa="card"
      >
        <section class="card__section card__section--image"></section>
        <section class="card__section card__section--article">
          APPLE A1419 iMac 27" Retina 5K Monoblock (MNED2UA/A)
        </section>
        <section class="card__section card__section--code">
          Product code: 195434
        </section>
        <section class="card__section--review ">
          <ul class="stars stars--4">
            <li class="stars__item"></li>
            <li class="stars__item"></li>
            <li class="stars__item"></li>
            <li class="stars__item"></li>
            <li class="stars__item"></li>
          </ul>
          <div class="card__section card__section--comments">Reviews: 5</div>
        </section>
        <section class="card__section card__section--price">
          <div class="card__price-text">Price</div>
          <div class="card__price-value">$2,199</div>
        </section>
        <section>
          <a
            href="#"
            data-qa="hover"
            class="card__button"
          >Buy</a>
        </section>
      </div>
    </main>
  </body>
</html>
