<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Catalog</title>
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="styles/index.scss"
    />
  </head>

  <body>
    <h1>Catalog</h1>
    <header class="header nav-area">
      <a
        class="logo"
        href="#"
      >
        <img
          src="./images/logo.png"
          alt="logo"
        />
      </a>
      <nav class="nav">
        <ul>
          <li>
            <a
              href="#"
              class="is-active"
            >
              Apple
            </a>
          </li>
          <li><a href="#">Samsung</a></li>
          <li><a href="#">Smartphones</a></li>
          <li>
            <a data-qa="nav-hover"
              href="#"
            >
              Laptops & Computers
            </a>
          </li>
          <li><a href="#">Gadgets</a></li>
          <li><a href="#">Tablets</a></li>
          <li><a href="#">Photo</a></li>
          <li><a href="#">Video</a></li>
        </ul>
      </nav>
    </header>


    <div class="stars stars--0">
      <span class="stars__star"></span>
      <span class="stars__star"></span>
      <span class="stars__star"></span>
      <span class="stars__star"></span>
      <span class="stars__star"></span>
    </div>
    <div class="stars stars--1">
      <span class="stars__star"></span>
      <span class="stars__star"></span>
      <span class="stars__star"></span>
      <span class="stars__star"></span>
      <span class="stars__star"></span>
    </div>
    <div class="stars stars--2">
      <span class="stars__star"></span>
      <span class="stars__star"></span>
      <span class="stars__star"></span>
      <span class="stars__star"></span>
      <span class="stars__star"></span>
    </div>
    <div class="stars stars--3">
      <span class="stars__star"></span>
      <span class="stars__star"></span>
      <span class="stars__star"></span>
      <span class="stars__star"></span>
      <span class="stars__star"></span>
    </div>
    <div class="stars stars--4">
      <span class="stars__star"></span>
      <span class="stars__star"></span>
      <span class="stars__star"></span>
      <span class="stars__star"></span>
      <span class="stars__star"></span>
    </div>
    <div class="stars stars--5">
      <span class="stars__star"></span>
      <span class="stars__star"></span>
      <span class="stars__star"></span>
      <span class="stars__star"></span>
      <span class="stars__star"></span>
    </div>

    <main class="product-cards">
      <article
        class="product-card"
        data-qa="card"
      >
        <div class="image">
          <img
            class="img"
            src="./images/imac.jpeg"
            alt="product"
          />
        </div>
        <div class="product-body">
          <h2 class="product-title">
            APPLE A1419 iMac 27" Retina 5K Monoblock (MNED2UA/A)
          </h2>
          <span class="code">Product code: 195434</span>
          <div class="star-area">
            <div class="stars">
              <img
                src="./images/star-active.svg"
                alt="star"
                class="stars__star"
              />
              <img
                src="./images/star-active.svg"
                alt="star"
                class="stars__star"
              />
              <img
                src="./images/star-active.svg"
                alt="star"
                class="stars__star"
              />
              <img
                src="./images/star-active.svg"
                alt="star"
                class="stars__star"
              />
              <img
                src="./images/star.svg"
                alt="star"
                class="stars__star"
              />
            </div>
            <span class="quantity">Reviews: 5</span>
          </div>
          <div class="price-area">
            <span class="span">Price:</span>
            <strong class="price">$2,199</strong>
          </div>
          <button
            class="button" data-qa="card-hover"
          >
            buy
          </button>
        </div>
      </article>
    </main>

  </body>
</html>
