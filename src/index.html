<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Catalog</title>
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="styles/index.scss"
    />
  </head>

  <body>
    <header class="header">
      <a
        href="index.html"
        class="logo"
      >
        <img
          src="images/logo.png"
          alt="logo"
        />
      </a>
      <nav class="nav">
        <ul class="nav__list">
          <li class="nav__item">
            <a
              href="#"
              class="nav__link is-active"
            >
              apple
            </a>
          </li>
          <li class="nav__item">
            <a
              href="#"
              class="nav__link"
            >
              samsung
            </a>
          </li>
          <li class="nav__item">
            <a
              href="#"
              class="nav__link"
            >
              smartphones
            </a>
          </li>
          <li class="nav__item">
            <a
              href="#"
              data-qa="nav-hover"
              class="nav__link"
            >
              laptops & computers
            </a>
          </li>
          <li class="nav__item">
            <a
              href="#"
              class="nav__link"
            >
              gadgets
            </a>
          </li>
          <li class="nav__item">
            <a
              href="#"
              class="nav__link"
            >
              tablets
            </a>
          </li>
          <li class="nav__item">
            <a
              href="#"
              class="nav__link"
            >
              photo
            </a>
          </li>
          <li class="nav__item">
            <a
              href="#"
              class="nav__link"
            >
              video
            </a>
          </li>
        </ul>
      </nav>
    </header>

    <main class="main">
      <div
        class="cards-container"
        id="cards-container"
      >
        <div
          class="cards"
          id="card-template"
          data-qa="card"
        >
          <div class="cards__image">
            <img
              src="./images/imac.jpeg"
              alt="img"
            />
          </div>

          <div class="cards__title">
            <h2 class="cards__p">
              APPLE A1419 iMac 27" Retina 5K Monoblock (MNED2UA/A)
            </h2>
          </div>

          <div class="cards__opis">
            <p class="cards__opis_p">Product code: 195434</p>
          </div>

          <div class="cards__reviews">
            <section class="stars stars--4">
              <div class="stars__star stars__star--active"></div>
              <div class="stars__star stars__star--active"></div>
              <div class="stars__star stars__star--active"></div>
              <div class="stars__star stars__star--active"></div>
              <div class="stars__star"></div>
            </section>
            <p class="cards__reviews_inf">Reviews: 5</p>
          </div>

          <div class="cards__price">
            <p class="cards__price-title">Price:</p>
            <p class="price">$2,199</p>
          </div>

          <div class="cards__buy">
            <button
              class="buy-button"
              data-qa="card-hover"
            >
              BUY
            </button>
          </div>
        </div>
      </div>
    </main>

    <script>
      const numberOfCards = 8;

      const cardTemplate = document.getElementById('card-template');

      const cardsContainer = document.getElementById('cards-container');

      for (let i = 1; i < numberOfCards; i++) {
        const cardClone = cardTemplate.cloneNode(true);

        cardClone.style.display = 'block';

        cardsContainer.appendChild(cardClone);
      }
    </script>
  </body>
</html>
