<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Catalog</title>
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="styles/index.scss"
    />
  </head>

  <body>
    <header class="catalog-header">
      <a
        class="catalog-header__logo logo"
        href="#"
      >
        <img
          src="images/logo.png"
          alt="Logo"
          class="logo__image"
        />
      </a>

      <nav class="catalog-header__nav">
        <a
          href="/apple"
          class="catalog-header__link catalog-header__link--active is-active"
        >
          APPLE
        </a>
        <a
          href="/samsung"
          class="catalog-header__link"
        >
          Samsung
        </a>
        <a
          href="/smartphones"
          class="catalog-header__link"
        >
          SMARTPHONES
        </a>
        <a
          href="/computers"
          class="catalog-header__link"
          data-qa="nav-hover"
        >
          LAPTOPS & COMPUTERS
        </a>
        <a
          href="/gadgets"
          class="catalog-header__link"
        >
          GADGETS
        </a>
        <a
          href="/tablets"
          class="catalog-header__link"
        >
          TABLETS
        </a>
        <a
          href="/photo"
          class="catalog-header__link"
        >
          PHOTO
        </a>
        <a
          href="/video"
          class="catalog-header__link"
        >
          VIDEO
        </a>
      </nav>
    </header>
    <main>
      <div
        class="catalog"
        id="catalog"
      >
        <!-- Добавлен id="catalog" -->
        <template id="card-template">
          <div class="card">
            <img
              src="images/imac.jpeg"
              alt="image"
              class="card__image"
            />
            <h2 class="card__title">
              APPLE A1419 iMac 27" Retina 5K Monoblock (MNED2UA/A)
            </h2>
            <p class="card__code">Product code: 195434</p>
            <div class="card__stars stars">
              <div class="stars stars--4">
                <div class="stars__star"></div>
                <div class="stars__star"></div>
                <div class="stars__star"></div>
                <div class="stars__star"></div>
                <div class="stars__star"></div>
              </div>
              <div class="stars__reviews">Reviews: 5</div>
            </div>
            <div class="card__price">
              <p class="label">Price:</p>
              <h2 class="amount">$2,199</h2>
            </div>
            <a
              href="#"
              class="card__button"
            >
              BUY
            </a>
          </div>
        </template>
      </div>
    </main>
    <script>
      document.addEventListener('DOMContentLoaded', function () {
        const catalogContainer = document.getElementById('catalog');
        const template = document.getElementById('card-template');

        const products = new Array(8).fill({
          image: 'images/imac.jpeg',
          title: 'APPLE A1419 iMac 27" Retina 5K Monoblock (MNED2UA/A)',
          code: 'Product code: 195434',
          price: '$2,199',
          stars: 4,
          reviews: 5,
        });

        products.forEach(() => {
          const clone = document.importNode(template.content, true);
          catalogContainer.appendChild(clone);
        });
      });
    </script>
  </body>
</html>
