<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catalog</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles/index.scss" />
</head>
<body>
  <header class="header">
    <nav class="nav">
      <ul class="nav__list">
        <li class="nav__item">
          <a href="#" class="nav__link is-active">Apple</a>
        </li>
        <li class="nav__item">
          <a href="#" class="nav__link">Samsung</a>
        </li>
        <li class="nav__item">
          <a href="#" class="nav__link">Xiaomi</a>
        </li>
        <li class="nav__item">
          <a href="#" class="nav__link" data-qa="nav-hover">Laptops & computers</a>
        </li>
        <li class="nav__item">
          <a href="#" class="nav__link">Accessories</a>
        </li>
      </ul>
    </nav>
  </header>
  <main class="catalog">
    <article class="card" data-qa="card">
      <div class="card__image">
        <img src="https://via.placeholder.com/200" alt="Product Image">
      </div>
      <h2 class="card__title">Product Title 1</h2>
      <div class="card__stars">
        <span class="stars stars--filled">&#9733;&#9733;&#9733;&#9733;&#9734;</span>
      </div>
      <p class="card__price">$999</p>
      <a href="#" class="card__button" data-qa="card-hover">Buy</a>
    </article>

    <article class="card">
      <div class="card__image">
        <img src="https://via.placeholder.com/200" alt="Product Image">
      </div>
      <h2 class="card__title">Product Title 2</h2>
      <div class="card__stars">
        <span class="stars stars--filled">&#9733;&#9733;&#9733;&#9733;&#9734;</span>
      </div>
      <p class="card__price">$799</p>
      <a href="#" class="card__button">Buy</a>
    </article>

    <article class="card">
      <div class="card__image">
        <img src="https://via.placeholder.com/200" alt="Product Image">
      </div>
      <h2 class="card__title">Product Title 3</h2>
      <div class="card__stars">
        <span class="stars stars--filled">&#9733;&#9733;&#9733;&#9734;&#9734;</span>
      </div>
      <p class="card__price">$499</p>
      <a href="#" class="card__button">Buy</a>
    </article>

    <article class="card">
      <div class="card__image">
        <img src="https://via.placeholder.com/200" alt="Product Image">
      </div>
      <h2 class="card__title">Product Title 4</h2>
      <div class="card__stars">
        <span class="stars stars--filled">&#9733;&#9733;&#9733;&#9733;&#9733;</span>
      </div>
      <p class="card__price">$1299</p>
      <a href="#" class="card__button">Buy</a>
    </article>
  </main>
</body>
</html>
