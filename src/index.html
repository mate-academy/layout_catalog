<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Catalog</title>
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="styles/index.scss"
    />
    <link
      rel="stylesheet"
      href="styles/main.scss"
    />
    <link
      rel="stylesheet"
      href="styles/header.scss"
    />
  </head>

  <body>
  <header class="main-header">
    <div class="container-header">
      <div class="logo-container">
        <a href="#">
          <img
            src="./images/logo.png"
            alt="Logo"
          />
        </a>
      </div>
      <nav class="main-nav">
        <ul>
          <li>
            <a
              href="#"
              class="main-link is-active"
            >
              Apple
            </a>
          </li>
          <li>
            <a
              href="#"
              class="main-link"
            >
              Samsung
            </a>
          </li>
          <li>
            <a
              href="#"
              class="main-link"
            >
              Smartphones
            </a>
          </li>
          <li>
            <a
              href="#"
              class="main-link"
              data-qa="hover"
            >
              Laptops & Computers
            </a>
          </li>
          <li>
            <a
              href="#"
              class="main-link"
            >
              Gadgets
            </a>
          </li>
          <li>
            <a
              href="#"
              class="main-link"
            >
              Tablets
            </a>
          </li>
          <li>
            <a
              href="#"
              class="main-link"
            >
              Photo
            </a>
          </li>
          <li>
            <a
              href="#"
              class="main-link"
            >
              Video
            </a>
          </li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="catalog">
    <div class="card" data-qa="card">
      <img class="card__image" src="../src/images/imac.jpeg" alt="Product" />
      <div class="card__title">MacBook Pro</div>
      <div class="stars stars--4">
        <div class="stars__star"></div>
        <div class="stars__star"></div>
        <div class="stars__star"></div>
        <div class="stars__star"></div>
        <div class="stars__star"></div>
      </div>
      <a href="#" class="card__button" data-qa="card-hover">Buy</a>
    </div>

    <div class="card">
      <img class="card__image" src="../src/images/imac.jpeg" alt="Product" />
      <div class="card__title">Galaxy S24</div>
      <div class="stars stars--5">
        <div class="stars__star"></div>
        <div class="stars__star"></div>
        <div class="stars__star"></div>
        <div class="stars__star"></div>
        <div class="stars__star"></div>
      </div>
      <a href="#" class="card__button">Buy</a>
    </div>
  </main>
  </body>
</html>
