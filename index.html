<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Catalog Page</title>
    <link rel="stylesheet" href="src/styles/main.scss"/>
  </head>
  <body>
    <header class="header">
      <!-- Rewritten header with BEM -->
      <nav class="header__nav">
        <ul class="nav">
          <li class="nav__item"><a class="nav__link is-active" href="#">Apple</a></li>
          <li class="nav__item"><a class="nav__link" href="#">TV & Video</a></li>
          <li class="nav__item"><a class="nav__link" href="#">Phones</a></li>
          <li class="nav__item">
            <a class="nav__link" data-qa="nav-hover" href="#">Laptops & Computers</a>
          </li>
        </ul>
      </nav>
    </header>

    <main class="catalog">
      <article class="card" data-qa="card">
        <h2 class="card__title">Product Title</h2>
        <div class="card__stars">
          <!-- Reuse stars component here -->
        </div>
        <button class="card__button" data-qa="card-hover">Buy</button>
      </article>

      <!-- Repeat other cards without data-qa -->
    </main>
  </body>
</html>
